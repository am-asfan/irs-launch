<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#360510">
  <title>ICSTIRS 2027 · Website Launch</title>
  <link rel="stylesheet" href="stage.css">
  <script src="stage.js" defer></script>
</head>

<body>
  <main class="stage" data-scene="closed">
    <div class="backdrop" aria-hidden="true">
      <div class="site-header"><img src="irs-logo.png" alt=""></div>
      <div class="site-hero">ICST International<br>Research Symposium 2027</div>
    </div>
    <div class="curtain left" aria-hidden="true"></div>
    <div class="curtain right" aria-hidden="true"></div>
    <div class="stage-light" aria-hidden="true"></div>
    <div class="stage-wings" aria-hidden="true"></div>
    <div class="stage-valance" aria-hidden="true"></div>
    <section class="center">
      <div class="intro">
        <button id="start" class="logo-plate" type="button" aria-label="Open the curtains">
          <img src="irs-logo.png" width="760" height="238" alt="ICST IRS, 1st International Research Symposium 2027">
        </button>
      </div>
      <button id="start-now" type="button">START NOW</button>
      <button id="launch" type="button" hidden>LAUNCH NOW</button>
      <div id="countdown" role="status" aria-live="polite" aria-atomic="true" hidden></div>
      <div id="announcement" role="status" aria-live="polite" hidden>IRS PORTAL IS NOW LIVE</div>
      <noscript><a href="https://irs.icst.edu.lk/">Open the IRS website</a></noscript>
    </section>
    <div class="activation-effects" aria-hidden="true">
      <span class="energy-ring"></span>
      <span class="energy-ring"></span>
      <span class="energy-ring"></span>
      <span class="scan-line"></span>
      <span class="screen-flash"></span>
    </div>
  </main>
</body>

</html>
